<title>LLM Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* Layout: a left rail that IS the model's stack (input at the top, training at the bottom) doubles as navigation.
   The stage shows one module at a time: intuition -> interactive lab -> math -> quiz. */
:root {
  --bg: #EDF0F6;
  --surface: #FAFBFE;
  --surface-2: #E3E8F3;
  --ink: #12203F;
  --muted: #55628A;
  --line: #C6CEE2;
  --grid: rgba(40, 70, 160, 0.07);
  --accent: #2B47D6;
  --accent-ink: #FFFFFF;
  --amber: #C96F00;
  --teal: #0A8670;
  --rose: #C4175F;
  --display: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1224; --surface: #131B33; --surface-2: #1C2645; --ink: #E7ECFA; --muted: #9AA8D0;
    --line: #2B3862; --grid: rgba(140, 170, 255, 0.06); --accent: #8197FF; --accent-ink: #0C1224;
    --amber: #FFB347; --teal: #3FD8B8; --rose: #FF78A8; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1224; --surface: #131B33; --surface-2: #1C2645; --ink: #E7ECFA; --muted: #9AA8D0;
  --line: #2B3862; --grid: rgba(140, 170, 255, 0.06); --accent: #8197FF; --accent-ink: #0C1224;
  --amber: #FFB347; --teal: #3FD8B8; --rose: #FF78A8; color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--ink);
  font: 17px/1.65 var(--serif);
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 56px;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.shell {
  display: grid; grid-template-columns: 264px minmax(0, 1fr); gap: clamp(20px, 4vw, 56px);
  max-width: 1340px; margin: 0 auto;
}

/* ---------- rail ---------- */
.rail {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start;
  max-height: calc(100vh - env(safe-area-inset-top, 0px)); overflow-y: auto; padding: 28px 0 24px;
  display: flex; flex-direction: column; gap: 18px;
}
.brand { font: 800 30px/1 var(--display); letter-spacing: -0.03em; }
.brand span { color: var(--accent); }
.tag { font: 500 12px/1.4 var(--mono); color: var(--muted); margin-top: 8px; }
.stack { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.node {
  display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left; cursor: pointer;
  padding: 8px 10px; border: 1px solid transparent; border-radius: 6px; background: none;
  font: 600 14px/1.3 var(--display);
}
.node:hover { background: var(--surface-2); }
.node[aria-current="true"] { background: var(--surface); border-color: var(--line); }
.node .idx { font: 500 12px var(--mono); color: var(--muted); width: 1.3em; flex: none; }
.node .seen { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--teal); opacity: 0; flex: none; align-self: center; }
.node.visited .seen { opacity: 1; }
.layers { margin: 6px 0 6px 8px; padding-left: 8px; border-left: 2px solid var(--accent); display: flex; flex-direction: column; gap: 2px; }
.layers-label { font: 500 11px var(--mono); color: var(--accent); margin: 8px 0 -2px 10px; letter-spacing: 0.04em; }
.part-label { font: 600 10.5px var(--display); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin: 14px 0 3px 4px; }
.roadmap { font: 500 12px/1.5 var(--mono); color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
.roadmap b { display: block; font: 600 11px var(--display); text-transform: uppercase; letter-spacing: 0.09em; margin-bottom: 4px; }
.roadmap ul { margin: 0; padding-left: 16px; }
.theme-row { display: flex; gap: 6px; }
.theme-row .btn { flex: 1; padding: 5px 6px; font-size: 12px; }

/* ---------- module page ---------- */
.stage { min-width: 0; padding: 28px 0 0; }
.module > * { max-width: 100%; }
.eyebrow { font: 500 12px var(--mono); color: var(--accent); letter-spacing: 0.06em; text-transform: uppercase; }
.module h1 { font: 800 clamp(30px, 4.4vw, 46px)/1.05 var(--display); letter-spacing: -0.03em; margin: 8px 0 14px; text-wrap: balance; }
.module h2 { font: 700 23px/1.2 var(--display); letter-spacing: -0.015em; margin: 40px 0 10px; text-wrap: balance; }
.module h3 { font: 700 16px/1.3 var(--display); margin: 22px 0 6px; }
.lede { font-size: 1.22em; line-height: 1.5; font-style: italic; color: var(--muted); max-width: 62ch; margin: 0 0 18px; }
.module p, .module ul.prose, .module ol.prose { max-width: 68ch; }
.module p { margin: 0 0 14px; }
.module ul.prose, .module ol.prose { padding-left: 22px; margin: 0 0 14px; }
.module li { margin-bottom: 4px; }
code, .mono { font: 500 0.86em var(--mono); background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
.module a { color: var(--accent); }

/* labs */
.lab {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin: 22px 0;
  display: flex; flex-direction: column; gap: 14px; min-width: 0;
}
.lab-title { font: 600 12px var(--display); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.lab-title::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--accent); }
.lab p { font-size: 0.95em; margin: 0; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
.ctl { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ctl-l { font: 500 13px var(--display); color: var(--muted); white-space: nowrap; }
.ctl input[type="range"] { width: min(170px, 38vw); accent-color: var(--accent); }
.ctl output, .val { font: 500 13px var(--mono); min-width: 3.4em; text-align: right; font-variant-numeric: tabular-nums; }
.btn {
  font: 600 13px var(--display); padding: 7px 13px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--ink); cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.btn:disabled { opacity: 0.5; cursor: default; }
select, input[type="text"], input[type="number"], textarea {
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font: 500 14px var(--mono); max-width: 100%;
}
textarea { width: 100%; min-height: 96px; resize: vertical; line-height: 1.5; }
label.chk { display: inline-flex; gap: 6px; align-items: center; font: 500 13px var(--display); color: var(--muted); cursor: pointer; }
canvas.cv { width: 100%; display: block; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 16px; align-items: start; }
.grid2 > * { min-width: 0; }
.readout { font: 500 13px/1.6 var(--mono); color: var(--ink); }
.readout b { color: var(--accent); font-weight: 500; }
.muted { color: var(--muted); }
.scroll-x { overflow-x: auto; max-width: 100%; }
.tbl { border-collapse: collapse; font: 500 13px var(--mono); font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 3px 9px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th { color: var(--muted); font-weight: 500; }
.tbl td:first-child, .tbl th:first-child { text-align: left; }
.tbl tr.sel td { background: var(--surface-2); }
.tbl tr.pick { cursor: pointer; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { display: inline-block; padding: 1px 7px; border-radius: 5px; font: 500 13px var(--mono); border: 1px solid var(--line); background: var(--surface-2); white-space: pre; }
.chip.c0 { border-color: var(--accent); } .chip.c1 { border-color: var(--amber); } .chip.c2 { border-color: var(--teal); } .chip.c3 { border-color: var(--rose); }
.bar { height: 10px; border-radius: 3px; background: var(--accent); }
.stackbar { display: flex; height: 22px; border-radius: 5px; overflow: hidden; border: 1px solid var(--line); }
.stackbar > div { height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font: 500 12px var(--mono); color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

/* pipeline diagram */
.flow { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
.flow .stg { flex: 1 1 130px; min-width: 120px; text-align: left; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 9px 11px; cursor: pointer; }
.flow .stg:hover { border-color: var(--accent); }
.flow .stg[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.flow .stg b { display: block; font: 700 13px var(--display); }
.flow .stg span { font: 500 12px var(--mono); color: var(--muted); }

/* math */
.eq { display: block; font: 400 1.08em/1.9 var(--serif); padding: 10px 16px; margin: 10px 0; background: var(--surface-2); border-radius: 6px; overflow-x: auto; white-space: nowrap; max-width: 100%; }
.eq var, .m var { font-style: italic; }
.fn { font-style: normal; }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 3px; line-height: 1.25; }
.frac > span:first-child { border-bottom: 1px solid currentColor; padding: 0 4px 1px; }
.frac > span:last-child { padding: 1px 4px 0; }
details.math, details.refresh { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); margin: 18px 0; max-width: 100%; }
details.refresh { border-style: dashed; }
details > summary { cursor: pointer; padding: 11px 15px; font: 700 14px var(--display); list-style: none; display: flex; gap: 10px; align-items: center; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "+"; font: 500 16px var(--mono); color: var(--accent); width: 1ch; }
details[open] > summary::before { content: "−"; }
details > summary small { font: 500 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-left: auto; }
.dbody { padding: 0 18px 14px; }
.note { border: 1px dashed var(--line); border-radius: 8px; background: var(--surface); padding: 10px 14px; font-size: 0.93em; max-width: 68ch; margin: 14px 0; }
.note b:first-child { font: 700 11px var(--display); text-transform: uppercase; letter-spacing: 0.09em; color: var(--amber); margin-right: 6px; }

/* quiz */
.quiz { display: flex; flex-direction: column; gap: 16px; max-width: 70ch; }
.q p { margin: 0 0 8px; }
.opt { display: block; width: 100%; text-align: left; padding: 8px 12px; margin: 0 0 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; font-size: 0.95em; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; color: inherit; }
.opt.right { border-color: var(--teal); background: color-mix(in srgb, var(--teal) 16%, var(--surface)); }
.opt.wrong { border-color: var(--rose); background: color-mix(in srgb, var(--rose) 14%, var(--surface)); }
.why { font-size: 0.93em; color: var(--muted); margin: 4px 0 0; }
.next { display: flex; justify-content: space-between; gap: 12px; margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--line); }

/* node graph (backprop) */
.graph { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
.gn { flex: 1 1 100px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 8px 10px; font: 500 12px/1.5 var(--mono); }
.gn b { display: block; font: 700 12px var(--display); margin-bottom: 4px; }
.gn .f { color: var(--accent); } .gn .g { color: var(--rose); }

@media (max-width: 880px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .rail {
    max-height: none; flex-direction: row; align-items: center; gap: 10px; overflow-x: auto; overflow-y: hidden;
    padding: 8px 0; background: var(--bg); border-bottom: 1px solid var(--line); z-index: 5;
  }
  .brand { font-size: 20px; flex: none; } .tag, .roadmap, .layers-label, .part-label, .theme-row { display: none; }
  .stack { flex-direction: row; gap: 4px; }
  .layers { flex-direction: row; margin: 0; padding: 0 0 0 6px; border-left: 2px solid var(--accent); gap: 4px; }
  .node { padding: 6px 9px; width: auto; white-space: nowrap; }
  .node .seen { display: none; }
  .stage { padding-top: 20px; }
  .module h2 { margin-top: 32px; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }

/* small editable matrices */
.mat { display: inline-flex; flex-direction: column; gap: 4px; }
.mat .mname { font: 700 12px var(--display); color: var(--muted); }
.mgrid { display: grid; grid-template-columns: repeat(2, 5em); gap: 4px; padding: 4px 8px; border-left: 2px solid var(--ink); border-right: 2px solid var(--ink); border-radius: 4px; }
.mgrid input { width: 100%; padding: 4px 6px; text-align: right; }
.mats { display: flex; flex-wrap: wrap; gap: 18px 28px; align-items: flex-end; }

</style>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Moduli"></nav>
  <main class="stage" id="stage"></main>
</div>
<script>
'use strict';
/* LLM Lab - shared helpers: DOM, theme-aware canvas, charts, 3D camera, math, quiz. */
const LAB = { modules: [], redraws: new Set(), uid: 0, tests: {} };

/* ---------- DOM ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
const uid = (p = 'c') => p + (++LAB.uid);
const f2 = (x, d = 2) => { const s = Number(x).toFixed(d); return /^-0\.?0*$/.test(s) ? s.slice(1) : s; };
const nfmt = v => { const a = Math.abs(v); if (a === 0) return '0'; if (a >= 10000 || a < 0.01) return v.toExponential(0).replace('e+', 'e'); return String(+v.toFixed(a < 1 ? 2 : a < 100 ? 1 : 0)); };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const sum = a => a.reduce((s, x) => s + x, 0);
const range = n => Array.from({ length: n }, (_, i) => i);
const human = n => { const a = Math.abs(n); if (a >= 1e12) return (n / 1e12).toFixed(2) + ' T'; if (a >= 1e9) return (n / 1e9).toFixed(2) + ' B'; if (a >= 1e6) return (n / 1e6).toFixed(1) + ' M'; if (a >= 1e3) return (n / 1e3).toFixed(1) + ' k'; return String(Math.round(n)); };

/* ---------- theme ---------- */
function theme() {
  const s = getComputedStyle(document.documentElement), g = n => (s.getPropertyValue(n) || '').trim() || '#888888';
  return { bg: g('--bg'), surface: g('--surface'), surface2: g('--surface-2'), ink: g('--ink'), muted: g('--muted'), line: g('--line'),
    accent: g('--accent'), amber: g('--amber'), teal: g('--teal'), rose: g('--rose') };
}
const MONO = "'IBM Plex Mono', ui-monospace, Menlo, monospace", SANS = "'Archivo', 'Helvetica Neue', Arial, sans-serif";
function onTheme(fn) { LAB.redraws.add(fn); }
function fireTheme() { LAB.redraws.forEach(fn => { try { fn(); } catch (e) { console.error(e); } }); }
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', fireTheme);
new MutationObserver(fireTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

const hex = c => { const m = /^#?([0-9a-f]{6})$/i.exec(c.trim()); const n = m ? parseInt(m[1], 16) : 0x888888; return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const rgba = (c, a) => { const [r, g, b] = hex(c); return `rgba(${r},${g},${b},${clamp(a, 0, 1)})`; };
const mixc = (c1, c2, t) => { const a = hex(c1), b = hex(c2); return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',')})`; };

/* ---------- canvas ---------- */
function setupCanvas(canvas, draw) {
  const ctx = canvas.getContext('2d');
  const o = { canvas, ctx, w: 0, h: 0 };
  o.fit = () => {
    const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    o.w = r.width; o.h = r.height;
    canvas.width = Math.max(1, Math.round(r.width * dpr)); canvas.height = Math.max(1, Math.round(r.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  o.redraw = () => {
    if (!o.w) o.fit();
    if (!o.w) return;
    ctx.clearRect(0, 0, o.w, o.h);
    draw(ctx, o.w, o.h, theme());
  };
  o.visible = () => canvas.offsetParent !== null || canvas.getClientRects().length > 0;
  if (window.ResizeObserver) new ResizeObserver(() => { o.fit(); o.redraw(); }).observe(canvas);
  else window.addEventListener('resize', () => { o.fit(); o.redraw(); });
  onTheme(o.redraw);
  return o;
}
function canvasEl(h = 280, cls = '') { const c = el('canvas', { class: 'cv ' + cls }); c.style.height = h + 'px'; return c; }

function arrow(ctx, x0, y0, x1, y1, color, w = 2, head = 8) {
  const a = Math.atan2(y1 - y0, x1 - x0);
  ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1 - Math.cos(a) * head * 0.6, y1 - Math.sin(a) * head * 0.6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x1, y1);
  ctx.lineTo(x1 - head * Math.cos(a - 0.4), y1 - head * Math.sin(a - 0.4));
  ctx.lineTo(x1 - head * Math.cos(a + 0.4), y1 - head * Math.sin(a + 0.4)); ctx.closePath(); ctx.fill(); ctx.restore();
}
function text(ctx, s, x, y, o = {}) {
  ctx.save(); ctx.font = `${o.weight || 500} ${o.size || 12}px ${o.sans ? SANS : MONO}`; ctx.fillStyle = o.color || '#888';
  ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'alphabetic'; ctx.fillText(s, x, y); ctx.restore();
}

/* generic line chart. series: [{xs, ys, color, dash, lw, label}] */
function chart(ctx, w, h, t, series, o = {}) {
  const pad = { l: o.padL ?? 46, r: o.padR ?? 14, t: o.padT ?? 14, b: o.padB ?? 32 };
  const x0 = pad.l, x1 = w - pad.r, y0 = h - pad.b, y1 = pad.t;
  const ally = series.flatMap(s => s.ys.filter(Number.isFinite)), allx = series.flatMap(s => s.xs);
  let xmin = o.xmin ?? Math.min(...allx), xmax = o.xmax ?? Math.max(...allx);
  let ymin = o.ymin ?? Math.min(...ally), ymax = o.ymax ?? Math.max(...ally);
  if (!Number.isFinite(ymin)) { ymin = 0; ymax = 1; }
  if (xmax === xmin) xmax = xmin + 1; if (ymax === ymin) ymax = ymin + 1;
  const X = v => x0 + (v - xmin) / (xmax - xmin) * (x1 - x0), Y = v => y0 - (v - ymin) / (ymax - ymin) * (y0 - y1);
  ctx.save(); ctx.font = `11px ${MONO}`; ctx.lineWidth = 1;
  const nx = o.nx ?? 5, ny = o.ny ?? 4, yf = o.yfmt || nfmt, xf = o.xfmt || nfmt;
  for (let i = 0; i <= ny; i++) {
    const v = ymin + (ymax - ymin) * i / ny, y = Y(v);
    ctx.strokeStyle = rgba(t.line, 0.7); ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    ctx.fillStyle = t.muted; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText(yf(v), x0 - 6, y);
  }
  for (let i = 0; i <= nx; i++) {
    const v = xmin + (xmax - xmin) * i / nx, x = X(v);
    ctx.fillStyle = t.muted; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText(xf(v), x, y0 + 6);
  }
  ctx.strokeStyle = t.muted; ctx.beginPath(); ctx.moveTo(x0, y1); ctx.lineTo(x0, y0); ctx.lineTo(x1, y0); ctx.stroke();

    cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, moved: false }; cv.setPointerCapture(e.pointerId); cv.style.cursor = 'grabbing'; });
    cv.addEventListener('pointermove', e => {

      this.yaw += dx * 0.01; this.pitch = clamp(this.pitch + dy * 0.01, -1.5, 1.5); drag.x = e.clientX; drag.y = e.clientY; redraw();

/* Module 9 - inference: prefill vs decode, KV cache, memory, throughput, speculative decoding */

/* One attention head generating n positions. With useCache the K/V rows are computed once and appended;
   without it every step recomputes K and V (and Q) for the whole prefix. `proj` counts token-row projections. */
function kvDecode(Xs, Wq, Wk, Wv, useCache) {
  const n = Xs.length, d = Wq[0].length, outs = []; let proj = 0, Kc = [], Vc = [];
  for (let t = 0; t < n; t++) {
    if (useCache) {
      const x = [Xs[t]], q = MX.mul(x, Wq)[0];
      Kc.push(MX.mul(x, Wk)[0]); Vc.push(MX.mul(x, Wv)[0]); proj += 1;
      const a = softmax(Kc.map(k => dot(q, k) / Math.sqrt(d)));
      outs.push(range(d).map(j => sum(a.map((w, i) => w * Vc[i][j]))));
    } else {
      const r = attention(Xs.slice(0, t + 1), Wq, Wk, Wv, true); proj += t + 1;
      outs.push(r.Z[t]);
    }
  }
  return { outs, proj };
}
const kvBytesPerToken = (L, nkv, dh, bytes) => 2 * L * nkv * dh * bytes;
/* simplified roofline for one decode step with batch B: weights read once per step, each sequence reads its own KV cache */
function decodeStep(o) {
  const mem = (o.W + o.B * o.kvSeq) / o.bw, cmp = o.B * 2 * o.N / o.flops, t = Math.max(mem, cmp);
  return { t, tps: o.B / t, perUser: 1 / t, bound: mem >= cmp ? 'memoria' : 'calcolo', mem, cmp };
}
const specGain = (alpha, k) => alpha >= 1 ? k + 1 : (1 - Math.pow(alpha, k + 1)) / (1 - alpha);

'use strict';
/* Module 10 - post-training: SFT loss masking, reward model (Bradley-Terry), KL-regularised policy, DPO */
const sigmoid = x => 1 / (1 + Math.exp(-x));
/* 12 toy candidate answers to one prompt. Hand-defined features: q = true quality, len = length (0..1), refLogit = base-model preference */
const CANDS = [
  { n: 'sbagliata, secca', q: 0.20, len: 0.10, z: 1.2 }, { n: 'vaga, breve', q: 0.35, len: 0.20, z: 1.0 },
  { n: 'ok, breve', q: 0.60, len: 0.30, z: 1.4 }, { n: 'corretta, concisa', q: 0.75, len: 0.35, z: 1.5 },
  { n: 'ottima, media', q: 0.90, len: 0.50, z: 0.8 }, { n: 'ottima, dettagliata', q: 0.85, len: 0.70, z: 0.5 },
  { n: 'buona, lunga', q: 0.70, len: 0.60, z: 0.9 }, { n: 'prolissa', q: 0.50, len: 0.80, z: 0.4 },
  { n: 'molto prolissa', q: 0.45, len: 0.95, z: 0.2 }, { n: 'divagante', q: 0.30, len: 0.90, z: 0.3 },
  { n: 'riempitivo enorme', q: 0.55, len: 1.00, z: 0.1 }, { n: 'fuori tema, media', q: 0.15, len: 0.50, z: 0.7 },

/* labelers prefer a over b with probability sigmoid(4 (u_a - u_b)), u = q + bias * len: annotators like long answers */
function makePairs(bias, N, seed) {

  while (out.length < N) {
    const i = Math.floor(r() * CANDS.length), j = Math.floor(r() * CANDS.length); if (i === j) continue;
    const ui = CANDS[i].q + bias * CANDS[i].len, uj = CANDS[j].q + bias * CANDS[j].len;
    out.push(r() < sigmoid(4 * (ui - uj)) ? [i, j] : [j, i]); // [winner, loser]
  }

}
/* reward model r(y) = w . (q_hat, len): here the "features" are given; in reality they are learned from text */
const feat = c => [c.q, c.len];
function btLoss(w, P) { return P.reduce((s, [a, b]) => { const m = dot(w, feat(CANDS[a])) - dot(w, feat(CANDS[b])); return s - Math.log(sigmoid(m)); }, 0) / P.length; }

}

'use strict';
/* Module 11 - Mixture of Experts: top-k router, load balancing, capacity, active vs total parameters */

/* toy token set: 4 clusters of unequal size in a 2D "embedding" plane; cluster c has a preferred expert (c mod E) */
const MOE_CL = [[-1.5, 1.1, 108], [1.5, 1.3, 72], [-1.1, -1.5, 36], [1.7, -1.1, 24]];
function moeData(seed = 3) {
  const r = rng(seed), X = [], lab = [];
  MOE_CL.forEach(([cx, cy, n], c) => { for (let i = 0; i < n; i++) { X.push([cx + 0.5 * r.gauss(), cy + 0.5 * r.gauss()]); lab.push(c); } });
  return { X, lab };
}
const moeInit = (E, seed = 5) => { const r = rng(seed); return range(E).map(() => [r.gauss() * 0.9, r.gauss() * 0.9]); };
/* router: logits z = W x, p = softmax(z); top-k experts, gate weights = softmax restricted to the selected logits (as in Mixtral) */
function moeRoute(W, X, k) {
  return X.map(x => {
    const z = W.map(w => w[0] * x[0] + w[1] * x[1]), p = softmax(z), idx = range(W.length).sort((a, b) => z[b] - z[a]).slice(0, k), g = softmax(idx.map(i => z[i]));
    return { z, p, idx, g };
  });
}
function moeLoad(R, E) { const f = new Array(E).fill(0); let tot = 0; R.forEach(r => r.idx.forEach(i => { f[i]++; tot++; })); return f.map(v => v / tot); }
const moeMeanP = (R, E) => range(E).map(j => sum(R.map(r => r.p[j])) / R.length);
/* Switch-style auxiliary loss: E * sum_i f_i P_i  (= 1 when load and probabilities are uniform) */
function moeAux(R, E) { const f = moeLoad(R, E), P = moeMeanP(R, E); return E * sum(range(E).map(i => f[i] * P[i])); }
const moeCE = (R, lab, E) => -sum(R.map((r, n) => Math.log(r.p[lab[n] % E] + 1e-12))) / R.length;
/* gradient wrt W of  CE + lam * aux, treating the (non-differentiable) assignment fractions f as constants */
function moeGrad(W, X, lab, k, lam) {
  const E = W.length, R = moeRoute(W, X, k), f = moeLoad(R, E), N = X.length, G = W.map(() => [0, 0]);
  R.forEach((r, n) => {
    const fp = sum(range(E).map(i => f[i] * r.p[i]));
    for (let j = 0; j < E; j++) {
      const dz = (r.p[j] - (j === lab[n] % E ? 1 : 0)) / N + lam * (E / N) * r.p[j] * (f[j] - fp);
      G[j][0] += dz * X[n][0]; G[j][1] += dz * X[n][1];
    }
  });
  return G;
}
function moeTrain(W, X, lab, k, lam, steps, lr = 0.5) {
  let V = W.map(w => w.slice());
  for (let s = 0; s < steps; s++) { const G = moeGrad(V, X, lab, k, lam); V = V.map((w, j) => [w[0] - lr * G[j][0], w[1] - lr * G[j][1]]); }
  return V;
}
/* capacity: each expert accepts at most ceil(cf * N * k / E) assignments, in token order; the rest are dropped */
function moeDropped(R, E, k, cf) {
  const cap = Math.ceil(cf * R.length * k / E), cnt = new Array(E).fill(0); let drop = 0;
  R.forEach(r => r.idx.forEach(i => { if (cnt[i] >= cap) drop++; else cnt[i]++; }));
  return { drop: drop / (R.length * k), cap };
}
/* SwiGLU transformer with MoE FFN: parameters stored vs parameters used per token */
function moeParams(o) {
  const { d, L, hid, E, k, heads, kv, V } = o, dh = d / heads, attn = 2 * d * d + 2 * d * kv * dh, expert = 3 * d * hid, router = E > 1 ? d * E : 0, norms = 2 * d;
  const emb = 2 * V * d, shared = L * (attn + router + norms) + emb + d;
  return { total: shared + L * E * expert, active: shared + L * k * expert, shared, expertAll: L * E * expert, expertActive: L * k * expert };
}
/* expected fraction of experts touched by a batch of B tokens when routing is uniform at random */
const moeTouched = (E, k, B) => 1 - Math.pow(1 - k / E, B);
LAB.tests.moe = { moeData, moeInit, moeRoute, moeLoad, moeAux, moeCE, moeGrad, moeTrain, moeDropped, moeParams, moeTouched };

'use strict';
/* Module 12 - scaling laws: L(N, D) = E + A/N^a + B/D^b, compute-optimal allocation, overtraining for cheap inference */
const SCALE_FITS = {
  rep: { name: 'replica (Besiroglu et al. 2024)', E: 1.8172, A: 482.01, B: 2085.43, a: 0.3478, b: 0.3658 },
  orig: { name: 'originale (Hoffmann et al. 2022)', E: 1.6934, A: 406.4, B: 410.7, a: 0.3392, b: 0.2849 },
};
const scLoss = (N, D, f) => f.E + f.A / Math.pow(N, f.a) + f.B / Math.pow(D, f.b);
/* minimise L(N, C/6N) over N: setting the derivative to zero gives N^(a+b) = (a A / b B) (C/6)^b */
const scNopt = (C, f) => Math.pow(f.a * f.A / (f.b * f.B), 1 / (f.a + f.b)) * Math.pow(C / 6, f.b / (f.a + f.b));
/* tokens needed for a model of N parameters to reach loss Lt (Infinity if Lt is below what N can ever reach) */
function scDforLoss(N, Lt, f) { const r = Lt - f.E - f.A / Math.pow(N, f.a); return r <= 0 ? Infinity : Math.pow(f.B / r, 1 / f.b); }
const scCost = (N, D, I) => 6 * N * D + 2 * N * I; // training FLOPs + serving I tokens
function scBestN(Lt, I, f) {
  let best = null;
  for (let e = 7; e <= 13; e += 0.02) { const N = Math.pow(10, e), D = scDforLoss(N, Lt, f); if (!isFinite(D)) continue; const c = scCost(N, D, I); if (!best || c < best.c) best = { N, D, c, e }; }
  return best;
}

/* Toy model of superposition (after Elhage et al. 2022): n sparse features, m < n hidden dims.
   h = W x,  x^ = ReLU(W^T h + b),  loss = sum_i I_i (x_i - x^_i)^2 with importance I_i = decay^i. */
class SuperToy {
  constructor(n, m, S, decay, seed = 1) {
    Object.assign(this, { n, m, S, decay }); this.r = rng(seed);
    this.W = Float64Array.from({ length: m * n }, () => this.r.gauss() * 0.5); this.b = new Float64Array(n);
    this.I = Float64Array.from({ length: n }, (_, i) => Math.pow(decay, i));
    this.gW = new Float64Array(m * n); this.gb = new Float64Array(n);
    this.mW = new Float64Array(m * n); this.vW = new Float64Array(m * n); this.mb = new Float64Array(n); this.vb = new Float64Array(n); this.t = 0;
  }
  sample(B) { const { n, S, r } = this; return Array.from({ length: B }, () => Float64Array.from({ length: n }, () => r() < S ? 0 : r())); }
  lossGrad(X) {
    const { n, m, W, b, I, gW, gb } = this, B = X.length, h = new Float64Array(m), dz = new Float64Array(n), dh = new Float64Array(m);
    gW.fill(0); gb.fill(0); let loss = 0;
    for (const x of X) {
      h.fill(0); for (let k = 0; k < m; k++) for (let j = 0; j < n; j++) h[k] += W[k * n + j] * x[j];
      dh.fill(0);
      for (let i = 0; i < n; i++) {
        let z = b[i]; for (let k = 0; k < m; k++) z += W[k * n + i] * h[k];
        const xh = z > 0 ? z : 0, e = x[i] - xh; loss += I[i] * e * e;
        dz[i] = z > 0 ? -2 * I[i] * e / B : 0; gb[i] += dz[i];
        for (let k = 0; k < m; k++) { gW[k * n + i] += h[k] * dz[i]; dh[k] += W[k * n + i] * dz[i]; }
      }
      for (let k = 0; k < m; k++) for (let j = 0; j < n; j++) gW[k * n + j] += dh[k] * x[j];
    }
    return loss / B;
  }
  step(B = 256, lr = 0.03) {
    const loss = this.lossGrad(this.sample(B)); this.t++; const b1 = 0.9, b2 = 0.999, c1 = 1 - Math.pow(b1, this.t), c2 = 1 - Math.pow(b2, this.t);
    const upd = (p, g, M, V) => { for (let i = 0; i < p.length; i++) { M[i] = b1 * M[i] + (1 - b1) * g[i]; V[i] = b2 * V[i] + (1 - b2) * g[i] * g[i]; p[i] -= lr * (M[i] / c1) / (Math.sqrt(V[i] / c2) + 1e-8); } };

  }
  norms() { const { n, m, W } = this; return Array.from({ length: n }, (_, i) => Math.hypot(...Array.from({ length: m }, (_, k) => W[k * n + i]))); }
  gram() { const { n, m, W } = this; return Array.from({ length: n }, (_, i) => Array.from({ length: n }, (_, j) => { let s = 0; for (let k = 0; k < m; k++) s += W[k * n + i] * W[k * n + j]; return s; })); }
}

      <li><b>Sparse autoencoder (SAE)</b>: si addestra un autoencoder con molte più unità che dimensioni e con penalità di sparsità sulle attivazioni di un layer, per scomporre la superposition in direzioni più interpretabili ("feature"). Il laboratorio qui sopra mostra proprio il fenomeno che gli SAE cercano di invertire.</li>

      <li><b>Limiti</b>: le feature trovate sono spesso interpretabili solo in parte, i metodi sono costosi su modelli grandi e una spiegazione plausibile non è per forza fedele a ciò che il modello calcola davvero.</li>` }));

    root.append(details('math', 'La matematica: perché la superposition può convenire', 'formule', `
      <p>Con <var>x̂</var> = ReLU(<var>W</var><sup>T</sup><var>W</var> <var>x</var> + <var>b</var>) l'uscita per la feature <var>i</var> è, senza ReLU, <var>x̂</var><sub>i</sub> = ‖<var>w</var><sub>i</sub>‖² <var>x</var><sub>i</sub> + Σ<sub>j≠i</sub> (<var>w</var><sub>i</sub>·<var>w</var><sub>j</sub>) <var>x</var><sub>j</sub> + <var>b</var><sub>i</sub>, dove <var>w</var><sub>i</sub> è la colonna <i>i</i> di <var>W</var>.</p>

/* labelled queries: [text, index of the passage that answers it, a phrase that must survive chunking] */
const QUERIES = [
  ['Come sblocco la bici?', 0, 'codice QR'], ['Quanto costa una corsa?', 1, '1,50 € ogni 30 minuti'], ['Come disdico l\'abbonamento?', 3, 'Annulla rinnovo'],
  ['Cosa faccio se i freni non funzionano?', 4, 'Segnala problema'], ['Dove restituisco la bici?', 5, 'uno stallo libero'], ['Quanto dura la batteria delle bici elettriche?', 7, '60 chilometri'],
  ['A che ora chiude il servizio?', 8, 'dalle 6:00 alle 24:00'], ['Posso usare il servizio a 16 anni?', 11, 'autorizzazione di un genitore'],
];
const HARD_QUERY = 'Come faccio a smettere di pagare ogni anno?';
const STOPW = new Set('il lo la i gli le un uno una di a da in con su per tra fra e o ma se che non è sono si l d c all dell dal nel sul del della dei delle al alla alle nell sull ogni anche come cosa dove quanto quando posso faccio fare ha ho più'.split(' '));
/* crude Italian "stemming": keep the first 5 letters. Good enough to match abbonamento/abbonamenti, restituisco/restituiscono */
const ragTokens = s => s.toLowerCase().split(/[^a-zàèéìòù0-9]+/).filter(t => t && !STOPW.has(t)).map(t => t.length > 5 ? t.slice(0, 5) : t);
function ragStats(docs) {
  const D = docs.map(ragTokens), N = D.length, avg = D.reduce((a, d) => a + d.length, 0) / N, df = {};
  D.forEach(d => new Set(d).forEach(t => { df[t] = (df[t] || 0) + 1; }));
  return { D, N, avg, df };
}
function bm25Scores(docs, q, k1 = 1.5, b = 0.75) {
  const { D, N, avg, df } = ragStats(docs), qt = [...new Set(ragTokens(q))];
  return D.map(d => { const tf = {}; d.forEach(t => { tf[t] = (tf[t] || 0) + 1; }); return qt.reduce((s, t) => { if (!tf[t]) return s; const idf = Math.log(1 + (N - df[t] + 0.5) / (df[t] + 0.5)); return s + idf * tf[t] * (k1 + 1) / (tf[t] + k1 * (1 - b + b * d.length / avg)); }, 0); });

function tfidfScores(docs, q) {

/* a safe arithmetic evaluator (recursive descent; no eval). Accepts decimal comma or point. */
function safeCalc(expr) {
  const s = expr.replace(/,/g, '.').replace(/[x×]/g, '*').replace(/÷/g, '/').replace(/\s+/g, ''); let i = 0;

      <p>Questo è il modello di tutto il corso, nella forma di un <b>decoder-only transformer</b> in stile GPT-2, ridotto al minimo: per ogni posizione <i>t</i> del testo, leggere i caratteri fino a <i>t</i> e prevedere il carattere <i>t</i>+1. Tutto il codice (forward <i>e</i> gradienti di ogni parametro) è scritto a mano in JavaScript, nella pagina, senza librerie; i test automatici confrontano ogni gradiente con le differenze finite.</p>
      <p>Il testo è lo stesso del modulo 8 (circa 1900 caratteri di prosa sul gatto Micio): pochissimo, quindi il modello <b>imparerà</b> molto ma <b>memorizzerà</b> anche. Serve a vedere i meccanismi, non a produrre testi belli.</p>` }));

    const chars = [...new Set(CORPUS)].sort(), data = Int32Array.from([...CORPUS].map(c => chars.indexOf(c))), V = chars.length, nTr = Math.floor(data.length * 0.9);
    let cfg = { D: 16, H: 2, L: 1, T: 16 }, net = null, running = false, steps = 0, hist = { tr: [], va: [], x: [] }, seed = 21;
    const MAXSTEPS = 4000;
    const sel = (opts, v, cb, label) => select(opts, v, cb, label);
    const dSel = sel([['16', 'd = 16'], ['24', 'd = 24'], ['32', 'd = 32']], '16', v => { cfg.D = +v; if (cfg.D % cfg.H) cfg.H = 1; resetNet(); }, 'dimensione d');
    const hSel = sel([['1', '1 head'], ['2', '2 head'], ['4', '4 head']], '2', v => { cfg.H = +v; resetNet(); }, 'head');
    const lSel = sel([['1', '1 layer'], ['2', '2 layer']], '1', v => { cfg.L = +v; resetNet(); }, 'layer');
    const sLR = slider({ label: 'learning rate', min: 0.002, max: 0.03, step: 0.001, value: 0.01, fmt: v => v.toFixed(3) });
    const cvL = canvasEl(230), out = el('div', { class: 'readout' });
    const cl = setupCanvas(cvL, (ctx, w, h, t) => {
      if (!hist.x.length) { text(ctx, 'premi "Allena" per vedere la loss scendere', 20, h / 2, { color: t.muted, size: 12 }); return; }
      const c = chart(ctx, w, h, t, [{ xs: hist.x, ys: hist.tr, color: t.accent, lw: 2.5, label: 'train' }, { xs: hist.x, ys: hist.va, color: t.amber, lw: 2.5, label: 'validazione (10% del testo mai visto)' }, { xs: [0, Math.max(100, hist.x[hist.x.length - 1])], ys: [Math.log(V), Math.log(V)], color: t.muted, dash: [5, 4], lw: 1.5 }], { xlabel: 'passi', ylabel: 'cross-entropy (nat)', ymin: 0, nx: 5 });
      text(ctx, 'ln V = ' + f2(Math.log(V), 2) + ' (modello che tira a caso)', c.x1 - 6, c.Y(Math.log(V)) - 5, { align: 'right', color: t.muted, size: 10 });
    });
    function resetNet() {
      running = false; steps = 0; hist = { tr: [], va: [], x: [] }; cfg.T = 16; net = new TinyGPT(V, cfg, 11); seed = 21;
      summary(); cl.redraw(); if (attUpd) attUpd(); if (genOut) genOut.textContent = '';
    }
    function summary(extra = '') {
      out.innerHTML = `parametri: <b>${net.nParams.toLocaleString('it-IT')}</b> (d=${cfg.D}, ${cfg.H} head, ${cfg.L} layer, contesto ${cfg.T} caratteri, vocabolario ${V}) · passi: <b>${steps}</b>${hist.tr.length ? ` · loss train <b>${f2(hist.tr[hist.tr.length - 1], 2)}</b>, validazione <b>${f2(hist.va[hist.va.length - 1], 2)}</b>` : ''}${extra}`;
    }
    const rnd = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
    function trainFrame() {
      if (!running) return;
      const t0 = Date.now(), T = net.T;
      while (Date.now() - t0 < 14 && steps < MAXSTEPS) {
        const batch = []; for (let b = 0; b < 8; b++) { const s = Math.floor(rnd() * (nTr - T - 1)); batch.push(data.subarray(s, s + T + 1)); }
        net.lossAndGrad(batch); net.adam(sLR.get()); steps++;
        if (steps % 25 === 0) { hist.x.push(steps); hist.tr.push(net.evalLoss(data, 0, nTr)); hist.va.push(net.evalLoss(data, nTr, data.length)); }
      }
      summary(steps >= MAXSTEPS ? ' · fine (limite di passi)' : ''); cl.redraw(); if (attUpd && steps % 50 === 0) attUpd();
      if (steps >= MAXSTEPS) { running = false; if (attUpd) attUpd(); return; }
      requestAnimationFrame(trainFrame);
    }
    const goBtn = button('Allena / riprendi', () => { if (steps >= MAXSTEPS) resetNet(); if (!running) { running = true; requestAnimationFrame(trainFrame); } }, 'primary');
    const stopBtn = button('Pausa', () => { running = false; if (attUpd) attUpd(); });

    /* attention view */
    const sample = el('input', { type: 'text', value: CORPUS.slice(0, 16), maxlength: '16', 'aria-label': 'testo da analizzare', style: 'font:500 14px var(--mono);padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:min(100%,250px)' });
    let aL = 0, aH = 0; const cvA = canvasEl(330), attOut = el('div', { class: 'readout' });
    const layerSel = sel([['0', 'layer 1'], ['1', 'layer 2']], '0', v => { aL = Math.min(+v, cfg.L - 1); attUpd(); }, 'layer');
    const headSel = sel([['0', 'head 1'], ['1', 'head 2'], ['2', 'head 3'], ['3', 'head 4']], '0', v => { aH = Math.min(+v, cfg.H - 1); attUpd(); }, 'head');
    const toIdx = s => Int32Array.from([...s].map(c => chars.indexOf(c)).filter(i => i >= 0).slice(0, 16));
    const ca = setupCanvas(cvA, (ctx, w, h, t) => {
      const x = toIdx(sample.value); if (x.length < 2) { text(ctx, 'scrivi almeno 2 caratteri noti', 20, h / 2, { color: t.muted, size: 12 }); return; }
      const { cache } = net.forward(x), n = x.length, L0 = Math.min(aL, cfg.L - 1), H0 = Math.min(aH, cfg.H - 1), p = cache.layers[L0].p;
      const M = range(n).map(i => range(n).map(j => j <= i ? p[(H0 * n + i) * n + j] : -Infinity)), cell = Math.min(24, (w - 120) / n, (h - 60) / n), x0 = 56, y0 = 36;
      heat(ctx, M, x0, y0, cell, cell, { t, vmin: 0, vmax: 1, rows: [...x].map(i => chars[i] === ' ' ? '␣' : chars[i]), cols: [...x].map(i => chars[i] === ' ' ? '␣' : chars[i]), num: cell > 26 });
      text(ctx, 'riga = carattere che "guarda" · colonna = carattere guardato · blu intenso = più attenzione · le celle barrate sono nel futuro (maschera causale)', 8, 14, { color: t.muted, size: 10 });
      const avg = (hd, off) => { const pp = cache.layers[L0].p; let s = 0, c = 0; for (let i = off; i < n; i++) { s += pp[(hd * n + i) * n + i - off]; c++; } return s / c; };
      attOut.innerHTML = `attenzione media di ogni head del layer ${L0 + 1} verso: <b>il carattere precedente</b> ${range(cfg.H).map(hd => 'h' + (hd + 1) + ' ' + f2(avg(hd, 1), 2)).join(' · ')} · <b>se stesso</b> ${range(cfg.H).map(hd => 'h' + (hd + 1) + ' ' + f2(avg(hd, 0), 2)).join(' · ')} (a caso: circa ${f2(range(n).reduce((s, i) => s + 1 / (i + 1), 0) / n, 2)})`;
    });
    function attUpd() { ca.redraw(); }
    sample.addEventListener('input', () => attUpd());

    /* generation */
    const sT = slider({ label: 'temperatura', min: 0.2, max: 1.5, step: 0.05, value: 0.8, fmt: v => v.toFixed(2) });
    const prompt = el('input', { type: 'text', value: 'il gatto ', 'aria-label': 'inizio del testo', style: 'font:500 14px var(--mono);padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:min(100%,250px)' });
    const genOut = el('div', { class: 'readout', style: 'white-space:pre-wrap;min-height:5em;border:1px dashed var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)' });
    function generate() {
      let ctxs = [...prompt.value].map(c => chars.indexOf(c)).filter(i => i >= 0); if (!ctxs.length) ctxs = [chars.indexOf(' ')];
      const T0 = sT.get(); let s = prompt.value;
      for (let k = 0; k < 140; k++) { const p = net.nextDist(ctxs, T0), u = Math.random(); let a = 0, ix = p.length - 1; for (let i = 0; i < p.length; i++) { a += p[i]; if (u <= a) { ix = i; break; } } ctxs.push(ix); s += chars[ix]; }
      genOut.textContent = s;
    }

    root.append(lab('Laboratorio · addestra il transformer', controls(dSel, hSel, lSel, sLR.el), controls(goBtn, stopBtn, button('Reinizializza', () => resetNet())), cvL, out,
      el('p', { class: 'muted', html: 'Ogni passo usa 8 finestre da 16 caratteri (128 previsioni) e un passo di Adam. Il tempo per passo dipende dalle dimensioni: con d = 32 e 2 layer è parecchie volte più lento di quello predefinito. Cambiare una dimensione riparte da zero. Nel modello predefinito la validazione tocca il minimo dopo qualche centinaio di passi e poi <b>risale</b> mentre il training continua a scendere: con ~1900 caratteri il modello comincia presto a memorizzare, e un modello più grande lo fa ancora prima. È il fenomeno del modulo 8, qui con un transformer; fermarsi al minimo (<i>early stopping</i>) è la cura più semplice.' })));
    root.append(lab('Laboratorio · che cosa guarda l\'attention (con il modello come è ora)', controls(layerSel, headSel, sample), cvA, attOut,
      el('p', { class: 'muted', html: 'Prima dell\'addestramento le righe sono quasi uniformi (ogni carattere guarda a caso i precedenti). Nel modello predefinito, dopo 4000 passi, una delle due head dedica circa metà della sua attenzione al carattere precedente, contro il 20% circa che avrebbe a caso (le cifre esatte cambiano con la configurazione e dal punto di partenza: il pannello qui sopra le ricalcola). Con un modello così piccolo e un testo così corto i pattern non sono netti come nelle head dei modelli grandi: è ciò che il modello ha imparato <i>qui</i>, non una dimostrazione generale.' })));
    root.append(lab('Laboratorio · generazione', controls(sT.el), el('div', { class: 'controls' }, prompt, button('Genera 140 caratteri', generate, 'primary')), genOut,
      el('p', { class: 'muted', html: 'Il modello produce un carattere alla volta, campionando dalla distribuzione prevista (modulo 7) e rimettendo il carattere in ingresso (modulo 9, senza KV cache per semplicità). Il testo ha l\'aspetto dell\'italiano (sillabe e parole quasi plausibili); dopo molti passi ripete interi frammenti del corpus, segno di memorizzazione. Non aspettarti frasi sensate.' })));
    resetNet(); attUpd();

    root.append(el('h2', { text: 'Il modello, riga per riga' }));
    root.append(el('ul', { class: 'prose', html: `
      <li><b>Embedding + posizione</b> (moduli 2, 3): <var>h</var><sub>t</sub> = <var>E</var>[<var>x</var><sub>t</sub>] + <var>P</var>[<var>t</var>]. Le posizioni sono qui appresi, come in GPT-2.</li>
      <li><b>Blocco</b> (moduli 4, 5, 6), ripetuto <var>L</var> volte: <var>h</var> ← <var>h</var> + Attn(LN(<var>h</var>)), poi <var>h</var> ← <var>h</var> + MLP(LN(<var>h</var>)). LayerNorm <i>prima</i> di ogni sotto-blocco (pre-LN), connessioni residual, attention causale multi-head, MLP con GELU di larghezza 3<var>d</var>.</li>
      <li><b>Uscita</b> (modulo 7): LN finale e logit = <var>f</var><sub>t</sub> · <var>E</var><sup>T</sup>: la stessa matrice dell'embedding riusata come unembedding (<i>weight tying</i>).</li>
      <li><b>Loss e training</b> (modulo 8): cross-entropy media su tutte le posizioni, gradienti per backpropagation, Adam.</li>
      <li><b>Inferenza</b> (moduli 7, 9): campionamento con temperatura, un carattere alla volta.</li>
      <li>Quello che <b>manca</b> rispetto a un LLM vero: tokenizer BPE (qui sono caratteri), milioni di volte più parametri e dati, ottimizzazione su GPU, post-training (modulo 10), e tutto il resto del corso su come si scala e si usa.</li>` }));

    root.append(details('math', 'La matematica: la backpropagation attraverso il blocco', 'formule', `
      <p>I gradienti si ottengono applicando la regola della catena a ritroso lungo lo stesso grafo del forward. I passaggi non banali:</p>
      <p><b>Matrici.</b> Per <var>C</var> = <var>A</var><var>B</var>: ∂ℒ/∂<var>A</var> = (∂ℒ/∂<var>C</var>) <var>B</var><sup>T</sup> e ∂ℒ/∂<var>B</var> = <var>A</var><sup>T</sup> (∂ℒ/∂<var>C</var>).</p>
      <p><b>Softmax dell'attention.</b> Con <var>p</var> = softmax(<var>s</var>) per riga e <var>dp</var> = ∂ℒ/∂<var>p</var>:</p>
      <span class="eq"><var>ds</var><sub>j</sub> = <var>p</var><sub>j</sub> ( <var>dp</var><sub>j</sub> − Σ<sub>j′</sub> <var>p</var><sub>j′</sub> <var>dp</var><sub>j′</sub> )</span>
      <p>e poi, con <var>s</var><sub>ij</sub> = <var>q</var><sub>i</sub>·<var>k</var><sub>j</sub>/√<var>d</var><sub>h</sub>: <var>dq</var><sub>i</sub> = Σ<sub>j</sub> <var>ds</var><sub>ij</sub> <var>k</var><sub>j</sub>/√<var>d</var><sub>h</sub>, <var>dk</var><sub>j</sub> = Σ<sub>i</sub> <var>ds</var><sub>ij</sub> <var>q</var><sub>i</sub>/√<var>d</var><sub>h</sub>, e per i value <var>dv</var><sub>j</sub> = Σ<sub>i</sub> <var>p</var><sub>ij</sub> <var>do</var><sub>i</sub>. La maschera causale si ottiene sommando solo su <var>j</var> ≤ <var>i</var>.</p>
      <p><b>LayerNorm.</b> Con <var>x̂</var> = (<var>x</var> − μ)/σ e <var>y</var> = γ<var>x̂</var> + β, ponendo <var>d</var><var>x̂</var> = <var>dy</var>·γ:</p>
      <span class="eq"><var>dx</var> = ${frac('1', 'σ')} ( <var>d</var><var>x̂</var> − media(<var>d</var><var>x̂</var>) − <var>x̂</var> · media(<var>d</var><var>x̂</var> ⊙ <var>x̂</var>) )</span>
      <p><b>Residual.</b> Per <var>h</var>′ = <var>h</var> + <var>F</var>(<var>h</var>): ∂ℒ/∂<var>h</var> = ∂ℒ/∂<var>h</var>′ + (∂<var>F</var>/∂<var>h</var>)<sup>T</sup> ∂ℒ/∂<var>h</var>′. Il termine identità è la "autostrada" del gradiente del modulo 6.</p>
      <p><b>Weight tying.</b> Poiché <var>E</var> è usata in ingresso e in uscita, il suo gradiente è la <i>somma</i> dei due contributi (il codice li accumula nello stesso array).</p>
      <p><b>Parametri.</b> Con vocabolario <var>V</var>, contesto <var>T</var>, dimensione <var>d</var>, MLP <var>F</var>, <var>L</var> layer: <var>V</var><var>d</var> + <var>T</var><var>d</var> + 2<var>d</var> + <var>L</var>(4<var>d</var>² + 2<var>d</var><var>F</var> + <var>F</var> + 5<var>d</var>) (due LayerNorm da 2<var>d</var>, bias <var>c</var><sub>1</sub>, <var>c</var><sub>2</sub>).</p>`));
    root.append(el('h2', { text: 'Verifica rapida' }));
    root.append(quiz([
      { q: 'A cosa serve la maschera causale nel training?', opts: ['A velocizzare il calcolo', 'A impedire che la previsione del carattere t+1 usi i caratteri successivi, così tutte le posizioni si addestrano in parallelo senza barare', 'A ridurre il vocabolario'], ans: 1, why: 'Senza maschera il modello potrebbe copiare la risposta dall\'ingresso. Con la maschera, un solo passaggio dà una previsione valida per ogni posizione.' },
      { q: 'Perché il gradiente di E nel weight tying è una somma?', opts: ['Perché E è molto grande', 'Perché E influisce sulla loss in due punti (ingresso e uscita) e i contributi si sommano', 'Perché Adam lo richiede'], ans: 1, why: 'Per la regola della catena, un parametro usato in più posti riceve la somma dei gradienti di ogni uso.' },
      { q: 'La loss di validazione smette di scendere mentre quella di training continua a calare. Cosa succede?', opts: ['Il modello sta imparando meglio', 'Il modello sta memorizzando il testo di training (overfitting)', 'Il learning rate è troppo basso'], ans: 1, why: 'Il modello si adatta a dettagli del training che non generalizzano: con un corpus di ~1900 caratteri succede presto.' },
    ]));
  },
});

'use strict';
/* App shell: builds the rail (the model stack as navigation) and shows one module at a time. */
(function () {
  const rail = $('#rail'), stage = $('#stage'), mods = LAB.modules;
  const seen = new Set();
  try { JSON.parse(localStorage.getItem('llmlab.seen') || '[]').forEach(x => seen.add(x)); } catch (e) { /* storage may be unavailable */ }

  const nodes = {}, pages = {};
  const PART = { m0: 'Fondamenti', m7: 'Output e training', m9: 'Modelli in produzione', m14: 'Capire e usare', m16: 'Capstone' };
  const mkNode = m => {
    const b = el('button', { class: 'node', type: 'button', 'data-id': m.id, onclick: () => show(m.id) },
      el('span', { class: 'idx', text: String(m.n) }), el('span', { text: m.title }), el('span', { class: 'seen' }));
    nodes[m.id] = b; return b;
  };

  rail.append(
    el('div', {}, el('div', { class: 'brand', html: 'LLM<span>·</span>Lab' }), el('div', { class: 'tag', text: 'come funziona un Large Language Model, un pezzo alla volta' })),
  );
  const list = el('div', { class: 'stack' });
  const first = mods.filter(m => !m.layer), inLayer = mods.filter(m => m.layer), after = mods.filter(m => !m.layer && m.n > Math.max(...inLayer.map(x => x.n)));
  const before = first.filter(m => m.n < Math.min(...inLayer.map(x => x.n)));
  const partLabel = m => PART[m.id] ? el('div', { class: 'part-label', text: PART[m.id] }) : null;
  before.forEach(m => { const pl = partLabel(m); if (pl) list.append(pl); list.append(mkNode(m)); });
  list.append(el('div', { class: 'layers-label', text: '× N layer (ripetuto)' }));
  const lay = el('div', { class: 'layers' }); inLayer.forEach(m => lay.append(mkNode(m))); list.append(lay);
  after.forEach(m => { const pl = partLabel(m); if (pl) list.append(pl); list.append(mkNode(m)); });
  rail.append(list);
  const th = el('div', { class: 'theme-row' });
  [['auto', 'Auto'], ['light', 'Chiaro'], ['dark', 'Scuro']].forEach(([v, t]) => th.append(button(t, () => {
    if (v === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', v);
  })));
  rail.append(th);

  mods.forEach((m, i) => {
    const page = el('article', { class: 'module', id: m.id, hidden: true, 'aria-label': m.title });
    page.append(el('div', { class: 'eyebrow', text: `Modulo ${m.n} · ${m.eyebrow}` }), el('h1', { text: m.heading || m.title }), el('p', { class: 'lede', html: m.lede }));
    m.build(page);
    const prev = mods[i - 1], next = mods[i + 1];
    page.append(el('div', { class: 'next' },
      prev ? button('← ' + prev.title, () => show(prev.id)) : el('span'),
      next ? button(next.title + ' →', () => show(next.id), 'primary') : el('span')));
    pages[m.id] = page; stage.append(page);
  });

  function show(id, fromHash) {
    if (!pages[id]) id = mods[0].id;
    mods.forEach(m => { pages[m.id].hidden = m.id !== id; nodes[m.id].setAttribute('aria-current', String(m.id === id)); });
    seen.add(id); nodes[id].classList.add('visited');
    try { localStorage.setItem('llmlab.seen', JSON.stringify([...seen])); } catch (e) { /* ignore */ }
    try { if (!fromHash) history.replaceState(null, '', '#' + id); } catch (e) { /* ignore */ }
    if (!fromHash) window.scrollTo({ top: 0 });
    window.dispatchEvent(new Event('resize'));
  }
  seen.forEach(id => nodes[id] && nodes[id].classList.add('visited'));
  window.addEventListener('hashchange', () => show(location.hash.slice(1), true));
  show(location.hash.slice(1) || mods[0].id, true);
  LAB.show = show;
})();

</script>
